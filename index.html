<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ForKop // Fandom Database</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="#">HOME</a>
    <a href="#">ALL FANDOMS</a>
    <a href="#">MARVEL</a>
    <a href="#">ADMIN</a>
  </nav>
  <header>
    <h1>ForKop // Fandom Database</h1>
    <p>Your ultimate fan archive</p>
    <button id="addBtn">Add New Fandom</button>
  </header>
  <main>
    <form id="uploadForm" class="hidden">
      <input id="name" placeholder="Name" required>
      <input id="cat" placeholder="Category" required>
      <textarea id="desc" placeholder="Description" required></textarea>
      <input type="file" id="img" accept="image/*" required>
      <button type="submit">Submit</button>
    </form>
    <div id="fandomGrid"></div>
  </main>
  <footer id="footer">Status: ONLINE | Dev: KISUNE | Site: ForKop</footer>
  <script type="module" src="script.js"></script>
</body>
</html>
